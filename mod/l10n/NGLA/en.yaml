pageName: "NGLA Map and Tracking Overhaul"
pageDescription: "Never Get Lost Again: world map, location search, tracking and compass."

compassGroup: "Compass"
compassEnabled: "Show compass"
compassEnabledDesc: "Show the compass at the top of the screen."
compassScale: "Compass size"
compassScaleDesc: "The default is 1.5, close to Skyrim's compass. Accepts 0.5 to 2."
compassPosX: "Horizontal position"
compassPosXDesc: "Where the compass's centre sits across the screen. 0 is the left edge, 0.5 the middle, 1 the right edge."
compassPosY: "Vertical position"
compassPosYDesc: "Where the compass sits down the screen. 0 is the top edge, 1 the bottom edge. The default is 0.05."
compassLabel: "Show destination name and distance"
compassLabelDesc: "Show the name and distance of the tracked destination closest to straight ahead, under the compass."

trackingGroup: "Tracking"
maxTracked: "Most destinations tracked at once"
maxTrackedDesc: "How many locations and pins you can track at the same time. Accepts 1 to 5."
autoClear: "Stop tracking on arrival"
autoClearDesc: "Stop tracking a location when you enter it, or a pin when you reach it."

travelGroup: "Fast Travel"
travelEnabled: "Enable fast travel"
travelEnabledDesc: "Clicking a location shows Fast Travel and Mark. Turn this off and a click simply marks it."
travelPassTime: "Fast travel takes time"
travelPassTimeDesc: "Off: travel is instant. On: game time passes based on the distance, at roughly walking pace."
travelVisitedOnly: "Only to places you've been"
travelVisitedOnlyDesc: "Limit fast travel to places you have visited. Visits are recorded from the moment this version is installed."

controlsGroup: "Controls"
mapKey: "Full map key"
mapKeyDesc: "Keyboard key that opens and closes the full-size map. Click the key name, then press the new key."
mapButton: "Full map controller button"
mapButtonDesc: "Controller button that opens and closes the full-size map. A, B and X are used on the map itself. The button keeps any action the game already gives it."
padNone: "None"
padY: "Y"
padLeftShoulder: "Left bumper (LB)"
padRightShoulder: "Right bumper (RB)"
padLeftStick: "Left stick click"
padRightStick: "Right stick click"
padBack: "Back / View"
padStart: "Start / Menu"
padDPadUp: "D-pad up"
padDPadDown: "D-pad down"
padDPadLeft: "D-pad left"
padDPadRight: "D-pad right"
